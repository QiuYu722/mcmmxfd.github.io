</head>

<body>
    <header class="header">
        <div class="header-title">秘密小分队</div>
        <nav class="nav" aria-label="主导航">
            <ul>
                <li><a href="index.html" class="nav-link">主页</a></li>
                <li><a href="map.html" class="nav-link">地图</a></li>
                <li><a href="landmark.html" class="nav-link">地标</a></li>

    <aside class="sidebar">
        <div>
            <h3>待建建筑</h3>
            <p>动物园<p>
        </div>
        <img src="image/index/zhao.png" alt=" Zhao">
    </aside>

    <main class="content-panel content-panel-oak">
        <section id="photo" class="page">
            <!-- 第一板块：轮播图占位色块 -->
            <div class="mc-panel photo-panel-1">
                <div class="photo-panel-row">
                    <div class="carousel-block">
                        <div class="carousel-container" style="width: 696px; height: 410px;">
                            <div class="carousel-slides" id="carouselSlides">
                                <div class="carousel-slide active">
                                    <img src="https://cdn.jsdelivr.net/gh/QiuYu722/mcmmxfd.github.io@main/image/GroupPhoto/hz1.webp" alt="合影 1">
                                </div>
                                <div class="carousel-slide">
                                    <img src="https://cdn.jsdelivr.net/gh/QiuYu722/mcmmxfd.github.io@main/image/GroupPhoto/hz2.webp" alt="合影 2">
                                </div>
                                <div class="carousel-slide">
                                    <img src="https://cdn.jsdelivr.net/gh/QiuYu722/mcmmxfd.github.io@main/image/GroupPhoto/hz3.webp" alt="合影 3">
                                </div>
                                <div class="carousel-slide">
                                    <img src="https://cdn.jsdelivr.net/gh/QiuYu722/mcmmxfd.github.io@main/image/GroupPhoto/hz4.webp" alt="合影 4">
                                </div>
                            </div>
                            <div class="carousel-indicators" id="carouselIndicators"></div>
                        </div>
                    </div>
                    <div class="agen-block">
                        <img src="image/index/agen.png" alt="Agen">
                    </div>
                </div>
            </div>

            <!-- 第一板块与第二板块之间的水平线（栅栏图案平铺） -->
            <div class="container-hr">
                <div></div>
                <img src="image/index/iron.png">
                <div></div>
                <img src="image/index/iron.png">
                <div></div>
            </div>

            <!-- 第二板块：公告板 + 图片展示（大图+小图 / 三小图） -->
            <div class="mc-panel photo-panel-2">
                <div class="photo-grid-2">
                    <aside class="announcement-board">
                        <div class="announcement-title">公告板</div>
                        <img class="announcement-jiang" src="image/index/jiang.png" alt="jiang" />
                        <div class="announcement-body">
                            <div class="announce-line">欢迎来到秘密小分队服务器<br /><br />玩法已上线：生存 / 建造<br />
                                <br />整合包：香草纪元<br />
                                <br />服务器状态：运行中<br />
                                
                            </div>

                        </div>
                    </aside>

                    <div aria-label="图片展示占位块">

                        <video src="image/video.mp4" controls style="width: 640px; height: 400px;margin-top: -10px;"></video>
                    </div>
                </div>
            </div>

            <!-- <div class="container-hr">
                <div></div>
                <img src="image/index/iron.png">
                <div></div>
                <img src="image/index/iron.png">
                <div></div>
            </div> -->

            <!-- 第三板块：三个名字各自三张照片 -->
            <!-- <div class="mc-panel photo-panel-3">
                
            </div> -->
